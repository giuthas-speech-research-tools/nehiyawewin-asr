[project]
name = "whisper-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "datasets[audio]>=4.8.4",
    "evaluate>=0.4.6",
    "gradio>=6.11.0",
    "jiwer>=4.0.0",
    "matplotlib>=3.11.0",
    "pipdeptree>=2.34.0",
    "pyyaml>=6.0.3",
    "tensorboard>=2.20.0",
    "torchcodec>=0.11.0",
    "transformers>=5.5.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }
