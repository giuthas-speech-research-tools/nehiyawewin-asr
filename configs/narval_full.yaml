# Hardware & Data
num_processors: 12
use_cpu: false
random_seed: 42
test_size: 0.1
sampling_rate: 16000

# Paths
base_model_id: "openai/whisper-small" # Or your local path
output_dir: "./whisper-small-cree-finetuned-gpu"

# Training Hyperparameters
train_batch_size: 32
grad_accum_steps: 2      # Effective batch size of 64
learning_rate: 1.0e-5    # Keep conservative for small data
warmup_steps: 100        # Reduced warmup for shorter total steps
max_steps: 1000          # Reduced to prevent excessive overfitting
save_steps: 200          # More frequent saves to catch best model
eval_steps: 200          # More frequent evaluation
logging_steps: 25

# Advanced Flags
bf16: true
gradient_checkpointing: true
dataloader_num_workers: 12
predict_with_generate: true # Recommended for monitoring WER during training