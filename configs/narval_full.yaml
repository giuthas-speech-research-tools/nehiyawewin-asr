# Hardware & Data
num_processors: 12      # Narval limit for 1 GPU
use_cpu: false    # Utilize the A100 GPU
random_seed: 42
test_size: 0.1
sampling_rate: 16000

# Paths (Strictly local/offline paths)
base_model_id: "./local-whisper-tiny"
wer_metric_path: "./metrics/wer"
cer_metric_path: "./metrics/cer"
metadata_csv: "metadata.csv"
output_dir: "./whisper-tiny-cree-finetuned-gpu"

# Training Hyperparameters
train_batch_size: 32
grad_accum_steps: 2
learning_rate: 1.0e-5
warmup_steps: 200
max_steps: 2000
save_steps: 500
eval_steps: 500
logging_steps: 50