# Hardware & Data
num_processors: 4          # Lowered from 12 (adjust to match your VM's vCPUs)
use_cpu: false
random_seed: 42
test_size: 0.1
sampling_rate: 16000

# Paths
base_model_id: "/data/plains-cree-asr/hf_cache/local_whisper_models/whisper-large"
output_dir: "/data/plains-cree-asr/hf_cache/whisper-large-finetuned"
metadata_csv: "./metadata.csv"
wer_metric_path: "wer"
cer_metric_path: "cer"

# Training Hyperparameters
train_batch_size: 2    
grad_accum_steps: 32      
learning_rate: 1.0e-5    
warmup_steps: 50
max_steps: 1000          
save_steps: 25
eval_steps: 25
logging_steps: 5

# Advanced Flags
bf16: true                 # Change to false if nvidia-smi shows an older GPU (T4, V100)
gradient_checkpointing: true
dataloader_num_workers: 2
predict_with_generate: true